<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平面パズルゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <h1>パズルゲーム</h1>

        <div class="split-layout">
            <div class="left-pane">
                <div class="info-panel">
                    <div id="score-display">SCORE: 0</div>
                    <div id="code-display" class="code-display">CODE: -- : -- : -- : -- : -- : -- : --</div>
                    <div id="timer">120.0</div>
                    <div id="message"></div>
                </div>
                <div class="difficulty-group">
                    <label for="difficulty">難易度: </label>
                    <select id="difficulty">
                        <option value="easy">Easy (5x5)</option>
                        <option value="normal" selected>Normal (7x7)</option>
                        <option value="hard">Hard (9x9)</option>
                    </select>
                </div>
                <div class="button-group">
                    <button id="start-btn">スタート</button>
                    <button id="check-btn" disabled>判定</button>
                </div>
            </div>

            <div class="right-pane">
                <div id="board" class="board"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
