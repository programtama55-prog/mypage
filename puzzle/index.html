<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コマンドパネル</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>コマンドパネル</h1>
            <button id="tutorial-btn" class="secondary-btn">遊び方（チュートリアル）</button>
        </div>

        <div class="split-layout">
            <div class="left-pane">
                <div class="info-panel">
                    <div id="score-display">SCORE: 0</div>
                    <div id="code-display" class="code-display">CODE: -- : -- : -- : -- : -- : -- : --</div>
                    <div id="timer">120.0</div>
                    <div id="message"></div>
                </div>
                <div class="difficulty-group">
                    <label for="difficulty">難易度: </label>
                    <select id="difficulty">
                        <option value="easy">Easy (4x4)</option>
                        <option value="normal" selected>Normal (5x5)</option>
                        <option value="hard">Hard (6x6)</option>
                        <option value="expert">Expert (7x7)</option>
                    </select>
                </div>
                <div class="button-group">
                    <button id="start-btn">スタート</button>
                    <button id="check-btn" disabled>判定</button>
                </div>
            </div>

            <div class="right-pane">
                <div id="board" class="board"></div>
            </div>
        </div>
    </div>

    <!-- チュートリアルモーダル -->
    <div id="tutorial-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>遊び方</h2>
            <div id="tutorial-content" class="tutorial-text">
                <!-- Javascriptで内容を切り替える -->
            </div>
            <div class="tutorial-controls">
                <button id="tutorial-prev" class="secondary-btn" disabled>前へ</button>
                <div id="tutorial-dots" class="dots-indicator"></div>
                <button id="tutorial-next" class="primary-btn">次へ</button>
            </div>
            <button id="tutorial-close" class="close-btn">&times;</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
